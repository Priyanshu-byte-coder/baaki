[project]
name = "baaki"
version = "0.1.0"
description = "Settlement reconciliation and audit engine for Indian payment-gateway merchants."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "duckdb>=1.1",
    "typer>=0.12",
    "rich>=13.9",
    "python-dateutil>=2.9",
    "groq>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
baaki = "baaki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/baaki"]

[tool.pytest.ini_options]
pythonpath = ["engine"]
testpaths = ["engine/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
